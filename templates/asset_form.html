{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl">
    <h2 class="text-3xl font-bold text-gray-900 mb-6">Add New Asset</h2>
    <form method="post" class="card p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Name</label>
            <input type="text" name="name" required class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Type</label>
                <select name="asset_type" class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option>Injection Molder</option>
                    <option>Blow Molder</option>
                    <option>Chiller</option>
                    <option>Conveyor</option>
                    <option>Compressor</option>
                    <option>Extruder</option>
                    <option>Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Criticality</label>
                <select name="criticality" class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Location</label>
            <input type="text" name="location" value="Romeoville - " class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Manufacturer</label>
                <input type="text" name="manufacturer" class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Model</label>
                <input type="text" name="model" class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Serial Number</label>
            <input type="text" name="serial_number" class="mt-1 block w-full border border-gray-300 rounded-lg px-3 py-2">
        </div>
        <div class="flex gap-3 pt-4">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2 rounded-lg font-medium">Save Asset</button>
            <a href="/assets" class="px-6 py-2 border border-gray-300 rounded-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
